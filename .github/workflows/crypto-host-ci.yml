name: crypto-host CI

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/src-tauri/crypto-host/**"
      - "desktop/src-tauri/Cargo.toml"
      - "desktop/src-tauri/deny.toml"
      - ".github/workflows/crypto-host-ci.yml"
  pull_request:
    paths:
      - "desktop/src-tauri/crypto-host/**"
      - "desktop/src-tauri/Cargo.toml"
      - "desktop/src-tauri/deny.toml"
      - ".github/workflows/crypto-host-ci.yml"

jobs:
  test:
    name: crypto-host (stub backend)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/src-tauri/crypto-host
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install libsecret (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libsecret-1-dev
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (stub backend, deny warnings)
        run: cargo clippy --no-default-features --features backend-stub --all-targets -- -D warnings
      - name: test (stub backend)
        run: cargo test --no-default-features --features backend-stub -- --nocapture
      - name: guardrail — no backend must fail to build
        shell: bash
        run: |
          if cargo check --no-default-features 2> /tmp/nb.log; then
            echo "::error::crypto-host built with no backend selected"
            cat /tmp/nb.log
            exit 1
          fi
          echo "OK: crypto-host refused to build with no backend"

  openmls-baseline:
    name: openmls baseline (audit + license)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri/crypto-host
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install libsecret (Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libsecret-1-dev
      - name: Install cargo-audit + cargo-deny
        run: cargo install --locked cargo-audit cargo-deny
      - name: Resolve openmls feature (generates Cargo.lock entries)
        run: cargo check --no-default-features --features backend-openmls
      - name: cargo audit
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set +e
          cargo audit --deny warnings > /tmp/cargo-audit.log 2>&1
          status=$?
          cat /tmp/cargo-audit.log
          exit $status
      - name: cargo deny (if configured)
        if: always()
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set +e
          if [ -f deny.toml ]; then
            cargo deny check licenses bans sources > /tmp/cargo-deny.log 2>&1
            status=$?
            cat /tmp/cargo-deny.log
            exit $status
          else
            echo "deny.toml not present yet — skipping (see docs/OPENMLS-BASELINE.md)" | tee /tmp/cargo-deny.log
          fi
      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmls-audit-diagnostics
          path: |
            /tmp/cargo-audit.log
            /tmp/cargo-deny.log
          if-no-files-found: warn
      - name: Upload resolved Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-openmls
          path: desktop/src-tauri/Cargo.lock

  openmls-slice1:
    name: openmls Slice 1 (identity + KeyPackage generation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri/crypto-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install libsecret (Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libsecret-1-dev
      - name: clippy (openmls backend, deny warnings)
        run: cargo clippy --no-default-features --features backend-openmls --all-targets -- -D warnings
      - name: test (openmls backend)
        run: cargo test --no-default-features --features backend-openmls -- --nocapture

  openmls-slice2:
    name: openmls Slice 2 (KeyPackage lifecycle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri/crypto-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install libsecret (Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libsecret-1-dev
      - name: clippy (openmls backend, deny warnings)
        run: cargo clippy --no-default-features --features backend-openmls --all-targets -- -D warnings
      - name: test — Slice 2 lifecycle (backend-openmls)
        run: cargo test --no-default-features --features backend-openmls s2_ -- --nocapture

  openmls-diagnostics:
    name: openmls diagnostics (concise failure tail)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri/crypto-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install libsecret (Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libsecret-1-dev >/dev/null
      - name: rustfmt diagnostic
        id: fmt
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > /tmp/fmt.log 2>&1
          status=$?
          tail -n 80 /tmp/fmt.log
          exit $status
      - name: openmls compile diagnostic
        id: check
        if: always()
        shell: bash
        run: |
          set +e
          cargo check --no-default-features --features backend-openmls > /tmp/check.log 2>&1
          status=$?
          tail -n 120 /tmp/check.log
          exit $status
      - name: strict clippy diagnostic (stub)
        if: always()
        shell: bash
        run: |
          set +e
          cargo clippy --no-default-features --features backend-stub --all-targets -- -D warnings > /tmp/clippy-stub.log 2>&1
          status=$?
          tail -n 120 /tmp/clippy-stub.log
          exit $status
      - name: strict clippy diagnostic (openmls)
        if: always()
        shell: bash
        run: |
          set +e
          cargo clippy --no-default-features --features backend-openmls --all-targets -- -D warnings > /tmp/clippy-openmls.log 2>&1
          status=$?
          tail -n 160 /tmp/clippy-openmls.log
          exit $status
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmls-diagnostics
          path: |
            /tmp/fmt.log
            /tmp/check.log
            /tmp/clippy-stub.log
            /tmp/clippy-openmls.log
          if-no-files-found: warn

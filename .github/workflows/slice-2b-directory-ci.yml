name: slice-2b directory CI

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/slice_2b_*.sql"
      - "src/lib/mls-directory.functions.ts"
      - "test/mls-substitution.test.ts"
      - ".github/workflows/slice-2b-directory-ci.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/slice_2b_*.sql"
      - "src/lib/mls-directory.functions.ts"
      - "test/mls-substitution.test.ts"
      - ".github/workflows/slice-2b-directory-ci.yml"

jobs:
  directory-sql:
    name: MLS KeyPackage directory (SQL integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whispr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: whispr_test
    steps:
      - uses: actions/checkout@v4

      # Minimal shims for auth.uid() / auth.users so migrations that assume
      # Supabase's `auth` schema apply cleanly against vanilla Postgres.
      - name: Bootstrap auth shim
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY,
            email text,
            encrypted_password text,
            aud text,
            role text,
            instance_id uuid,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now()
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS
          $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          -- Roles the migrations grant to.
          DO $do$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role;
            END IF;
          END $do$;
          SQL

      # Apply every migration in filename order. A failure here means the
      # migration itself is broken against a plain Postgres environment.
      - name: Apply migrations
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "==> applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run Slice 2B directory tests
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/slice_2b_directory.sql

  substitution-detection:
    name: Client-side substitution detection (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run vitest run test/mls-substitution.test.ts

name: slice-2b directory CI

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/slice_2b_*.sql"
      - "supabase/tests/native_mls_messaging.sql"
      - "src/lib/mls-directory.functions.ts"
      - "test/mls-substitution.test.ts"
      - ".github/workflows/slice-2b-directory-ci.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/slice_2b_*.sql"
      - "supabase/tests/native_mls_messaging.sql"
      - "src/lib/mls-directory.functions.ts"
      - "test/mls-substitution.test.ts"
      - "docs/E2EE-CI-LOOP.md"
      - ".github/workflows/slice-2b-directory-ci.yml"

jobs:
  directory-sql:
    name: MLS KeyPackage directory + relay (SQL integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whispr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: whispr_test
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Supabase shims
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY,
            email text,
            encrypted_password text,
            aud text,
            role text,
            instance_id uuid,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now()
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS
          $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;

          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.objects (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text NOT NULL,
            name text NOT NULL,
            owner uuid,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now()
          );
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;

          DO $do$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role;
            END IF;
          END $do$;
          DO $do$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'supabase_realtime') THEN
              CREATE PUBLICATION supabase_realtime;
            END IF;
          END $do$;
          SQL

      - name: Apply migrations
        id: migrations
        shell: bash
        run: |
          set +e
          : > /tmp/migrations.log
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "==> applying $f" | tee -a /tmp/migrations.log
            psql -v ON_ERROR_STOP=1 -f "$f" >> /tmp/migrations.log 2>&1
            status=$?
            if [ $status -ne 0 ]; then
              echo "FAILED: $f" | tee -a /tmp/migrations.log
              tail -n 160 /tmp/migrations.log
              exit $status
            fi
          done
          tail -n 80 /tmp/migrations.log

      - name: Run Slice 2B KeyPackage directory tests
        id: directory-tests
        if: success()
        shell: bash
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 -f supabase/tests/slice_2b_directory.sql > /tmp/directory-tests.log 2>&1
          status=$?
          cat /tmp/directory-tests.log
          exit $status

      - name: Run native MLS relay adversarial tests
        id: relay-tests
        if: success()
        shell: bash
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 -f supabase/tests/native_mls_messaging.sql > /tmp/relay-tests.log 2>&1
          status=$?
          cat /tmp/relay-tests.log
          exit $status

      - name: Upload SQL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-2b-migration-diagnostics
          path: |
            /tmp/migrations.log
            /tmp/directory-tests.log
            /tmp/relay-tests.log
          if-no-files-found: warn

  substitution-detection:
    name: Client-side substitution detection (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run vitest run test/mls-substitution.test.ts

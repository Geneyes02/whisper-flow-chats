name: apply native payload integration

on:
  pull_request:
    paths:
      - "scripts/apply_native_payload_patch.py"
      - "src/lib/native-attachment-client.ts"
      - "src/lib/native-message-payload.ts"
      - ".github/workflows/apply-native-payload-pr.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply asserted payload patch
        run: python scripts/apply_native_payload_patch.py
      - name: Format
        run: >-
          bun x prettier --write
          src/lib/native-mls-client.ts
          src/lib/native-local-history.ts
          src/lib/native-message-payload.ts
          src/lib/native-attachment-client.ts
          src/lib/native-attachments.functions.ts
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Commit if green
        shell: bash
        run: |
          if git diff --quiet; then
            echo "native payload integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib
          git commit -m "feat(e2ee): carry structured text and attachment payloads inside MLS"
          git push origin HEAD:${{ github.head_ref }}

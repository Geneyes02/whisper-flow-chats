name: rustfmt apply (Phase B branch)

on:
  workflow_dispatch:
  push:
    branches:
      - whispr/e2ee-phase-b
    paths:
      - "desktop/src-tauri/crypto-host/src/backend/openmls_runtime.rs"
      - "desktop/src-tauri/crypto-host/src/backend/mod.rs"
      - "desktop/src-tauri/crypto-host/src/keychain.rs"
      - ".github/workflows/rustfmt-apply.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whispr/e2ee-phase-b
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        working-directory: desktop/src-tauri/crypto-host
        run: cargo fmt --all
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "rustfmt already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri
          git commit -m "style(rust): apply rustfmt"
          git push origin HEAD:whispr/e2ee-phase-b

name: native MLS client CI

on:
  pull_request:
    paths:
      - "src/lib/crypto/**"
      - "src/lib/native-mls-client.ts"
      - "src/lib/native-mls.functions.ts"
      - "src/lib/mls-directory.functions.ts"
      - "supabase/migrations/20260724060000_native_mls_messaging.sql"
      - ".github/workflows/native-mls-client-ci.yml"
  push:
    paths:
      - "src/lib/crypto/**"
      - "src/lib/native-mls-client.ts"
      - "src/lib/native-mls.functions.ts"
      - "src/lib/mls-directory.functions.ts"
      - "supabase/migrations/20260724060000_native_mls_messaging.sql"
      - ".github/workflows/native-mls-client-ci.yml"
  workflow_dispatch:

jobs:
  typecheck:
    name: native MLS TypeScript contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bun x tsc --noEmit
      - name: Targeted ESLint
        id: eslint
        shell: bash
        run: |
          set +e
          bun x eslint \
            src/lib/crypto/types.ts \
            src/lib/crypto/encoding.ts \
            src/lib/crypto/libsignal-bridge.ts \
            src/lib/crypto/provider-registry.ts \
            src/lib/native-mls-client.ts \
            src/lib/native-mls.functions.ts \
            src/lib/mls-directory.functions.ts \
            > /tmp/eslint.log 2>&1
          status=$?
          cat /tmp/eslint.log
          exit $status
      - name: Upload ESLint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-mls-eslint
          path: /tmp/eslint.log
          if-no-files-found: warn
      - name: KeyPackage substitution tests
        if: success()
        run: bun x vitest run test/mls-substitution.test.ts

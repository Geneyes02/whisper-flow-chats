[package]
name = "whispr-crypto-host"
version = "0.1.0"
edition = "2021"
description = "Whispr native crypto host — swappable backend behind a stable command surface"
license = "MIT OR Apache-2.0"

[features]
default = ["backend-stub"]
backend-stub = []
backend-libsignal = []
backend-openmls = [
    "dep:openmls",
    "dep:openmls_rust_crypto",
    "dep:openmls_traits",
    "dep:openmls_basic_credential",
    "dep:tls_codec",
]

[dependencies]
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
thiserror     = "2"
zeroize       = { version = "1", features = ["derive"] }
rand_core     = { version = "0.6", features = ["getrandom"] }
sha2          = "0.10"
hex           = "0.4"
parking_lot   = "0.12"
base64        = "0.22"
aes-gcm       = "=0.11.0"

# OS keychain (macOS Keychain / Windows Credential Manager / Linux
# SecretService via libsecret). This is the ONLY persistent sink used by the
# crypto host for device and session secret snapshots / local-cache seal key.
keyring       = "3"

# Backend-openmls — gated. Pinned to the post-audit baseline documented in
# docs/OPENMLS-BASELINE.md. Do not bump without re-running the conformance,
# dependency-audit and server-blindness gates. These direct pins are part of
# the reproducible Phase B baseline; transitive versions remain locked by Cargo.lock.
openmls                    = { version = "=0.8.1", optional = true }
openmls_rust_crypto        = { version = "=0.5.1", optional = true }
openmls_traits             = { version = "=0.5.0", optional = true }
openmls_basic_credential   = { version = "=0.5.0", optional = true }
tls_codec                  = { version = "=0.4.2", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"

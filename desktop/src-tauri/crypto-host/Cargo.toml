[package]
name = "whispr-crypto-host"
version = "0.1.0"
edition = "2021"
description = "Whispr native crypto host — swappable backend behind a stable command surface"
license = "MIT OR Apache-2.0"

# ------------------------------------------------------------------------
# Backend selection
# ------------------------------------------------------------------------
# The Whispr application ONLY talks to this crate via the `CryptoBackend`
# trait + the `whispr_crypto_*` command shims in the Tauri app. The concrete
# implementation is chosen at build time by cargo feature:
#
#   backend-stub       — deterministic fail-closed backend. Used by CI, unit
#                        tests, and any build where a production crypto
#                        provider is not licensed / not desired.
#   backend-libsignal  — reserved scaffold only. No libsignal dependency is
#                        present in the graph; DO NOT enable for production.
#                        See docs/ADR-LIBSIGNAL-LICENSING.md.
#   backend-openmls    — MLS (RFC 9420) via openmls + openmls_rust_crypto.
#                        Production-candidate implementation is gated by the
#                        Phase B conformance and server-blindness suites.
#
# Exactly one backend must be selected. If none is selected, the crate
# refuses to compile so we never accidentally ship an unencrypted build.
# ------------------------------------------------------------------------

[features]
default = ["backend-stub"]
backend-stub = []
# Reserved feature for the fail-closed adapter in backend/libsignal.rs.
# Keeping this dependency-free prevents an unavailable placeholder crate from
# poisoning Cargo resolution for the OpenMLS build.
backend-libsignal = []
backend-openmls = [
    "dep:openmls",
    "dep:openmls_rust_crypto",
    "dep:openmls_traits",
    "dep:openmls_basic_credential",
    "dep:tls_codec",
]

[dependencies]
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
thiserror     = "2"
zeroize       = { version = "1", features = ["derive"] }
rand_core     = { version = "0.6", features = ["getrandom"] }
sha2          = "0.10"
hex           = "0.4"
parking_lot   = "0.12"
base64        = "0.22"

# OS keychain (macOS Keychain / Windows Credential Manager / Linux
# SecretService via libsecret). This is the ONLY persistent sink used by the
# crypto host for device and session secret snapshots.
keyring       = "3"

# Backend-openmls — gated. Pinned to the post-audit baseline documented in
# docs/OPENMLS-BASELINE.md. Do not bump without re-running the conformance,
# dependency-audit and server-blindness gates.
openmls                    = { version = "=0.8.1", optional = true }
openmls_rust_crypto        = { version = "=0.5.1", optional = true }
openmls_traits             = { version = "=0.5.0", optional = true }
openmls_basic_credential   = { version = "=0.5.0", optional = true }
tls_codec                  = { version = "=0.4.2", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"

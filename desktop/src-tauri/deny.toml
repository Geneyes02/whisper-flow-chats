# cargo-deny policy for the Whispr desktop workspace.
#
# This file enforces the license, bans, and sources gates in
# .github/workflows/crypto-host-ci.yml (openmls-baseline job). It is
# intentionally strict: the point of the gate is to catch a dependency
# swap that would either (a) pull an incompatible license into a signed
# desktop binary or (b) resolve a crate from an unvetted registry / git
# source.
#
# Ratchet-only: if a new dependency needs an allowance, add it here in
# the same PR that pulls it in, and justify it in the PR description.

[graph]
all-features = false
# Evaluate both the default (stub) build and the openmls build so this
# policy covers the graph the openmls-baseline CI job actually resolves.
features = ["openmls"]

# ---------------------------------------------------------------------------
# Advisories — pair with `cargo audit` in CI. cargo-deny gives us the
# yank / unmaintained / unsound signals that `cargo audit` alone does not.
# ---------------------------------------------------------------------------
[advisories]
version = 2
yanked = "deny"
ignore = []

# ---------------------------------------------------------------------------
# Licenses — every crate that ships in the desktop binary must be on this
# allow-list. openmls itself is MIT; the RustCrypto stack it pulls in is
# dual MIT/Apache-2.0; tauri/serde/etc. are MIT or Apache-2.0.
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
]

# Explicitly reject copyleft licenses that would contaminate a signed,
# closed-source desktop distribution. This is the ADR-LIBSIGNAL-LICENSING
# gate encoded as policy: if anything ever tries to pull AGPL/GPL/LGPL
# transitively, the build fails here before it ships.
[[licenses.exceptions]]
allow = ["OpenSSL"]
crate = "ring"

# ---------------------------------------------------------------------------
# Bans — pin the openmls stack. A silent bump past these versions must be
# a deliberate PR that also updates docs/OPENMLS-BASELINE.md.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Copyleft crates that must never end up in the desktop binary graph.
# libsignal-protocol is AGPL-3.0; see docs/ADR-LIBSIGNAL-LICENSING.md.
deny = [
  { crate = "libsignal-protocol", reason = "AGPL-3.0; gated behind backend-libsignal, must not resolve in shipped builds" },
]
# Exact-version gate for the audited MLS stack. Bumping any of these
# requires a matching entry in docs/OPENMLS-BASELINE.md and a fresh run
# of the messaging conformance suite.
[[bans.deny]]
crate = "openmls"
wrappers = []
[[bans.deny]]
crate = "openmls_rust_crypto"
wrappers = []
[[bans.deny]]
crate = "openmls_traits"
wrappers = []

# We *want* the pinned versions to resolve, so allow the exact pins
# through the deny entries above.
[[bans.allow]]
crate = "openmls@0.8.1"
[[bans.allow]]
crate = "openmls_rust_crypto@0.5.1"
[[bans.allow]]
crate = "openmls_traits@0.5.0"

# ---------------------------------------------------------------------------
# Sources — only crates.io. No git dependencies, no alternative registries.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

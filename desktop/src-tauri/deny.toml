# cargo-deny policy for the Whispr desktop workspace.
#
# Enforced by the openmls-baseline job in
# .github/workflows/crypto-host-ci.yml. Intent:
#
#   1. No copyleft license (AGPL / GPL / LGPL) ever enters the shipped
#      desktop binary graph. See docs/ADR-LIBSIGNAL-LICENSING.md.
#   2. No dependency resolves from git or an alternative registry —
#      crates.io only, so the Cargo.lock we archive from CI is the same
#      graph we'd rebuild.
#   3. Advisories are treated as build failures. Paired with
#      `cargo audit --deny warnings` in the same job for coverage of
#      yanks / unmaintained crates that cargo-audit alone flags.
#
# The exact-version pins for the audited openmls stack live in
# desktop/src-tauri/crypto-host/Cargo.toml (`=0.8.1`, `=0.5.1`,
# `=0.5.0`). A bump there without a matching docs/OPENMLS-BASELINE.md
# update is caught in review, not here.

[graph]
all-features = false
# Evaluate the openmls feature so this policy covers the graph the
# openmls-baseline CI job actually resolves.
features = ["openmls"]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
]

# `ring` ships under a bespoke license bundle that cargo-deny cannot
# SPDX-match; it is BoringSSL-derived (ISC + OpenSSL + MIT). Widely
# accepted in the Rust crypto ecosystem; explicitly allowed here so
# the gate does not fail on a well-known false positive.
[[licenses.exceptions]]
allow = ["OpenSSL", "ISC", "MIT"]
crate = "ring"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Copyleft crates that must never end up in the desktop binary graph.
# libsignal-protocol is AGPL-3.0; it is gated behind the
# `backend-libsignal` feature and this line ensures a stray dependency
# cannot pull it in transitively without a policy change.
deny = [
  { crate = "libsignal-protocol", reason = "AGPL-3.0; see docs/ADR-LIBSIGNAL-LICENSING.md" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
